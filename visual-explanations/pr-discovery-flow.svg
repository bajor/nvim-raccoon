<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Raccoon PR discovery flow</title>
  <desc id="desc">The PR picker either scans the configured repos allowlist or discovers repositories visible to each token, removes excluded repos, and lists open pull requests from the remaining repositories.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .decision { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .skip { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 12; }
      .text { font: 16px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <rect x="30" y="125" width="140" height="70" class="box" />
  <text x="100" y="154" text-anchor="middle" class="text">Config</text>
  <text x="100" y="176" text-anchor="middle" class="small">tokens, repos,</text>
  <text x="100" y="194" text-anchor="middle" class="small">excluded_repos</text>

  <polygon points="260,95 385,160 260,225 135,160" class="decision" />
  <text x="260" y="154" text-anchor="middle" class="text">repos set?</text>
  <text x="260" y="176" text-anchor="middle" class="small">allowlist mode</text>

  <rect x="455" y="45" width="180" height="70" class="box" />
  <text x="545" y="74" text-anchor="middle" class="text">Use allowlist</text>
  <text x="545" y="96" text-anchor="middle" class="small">configured repos only</text>

  <rect x="455" y="205" width="180" height="70" class="box" />
  <text x="545" y="234" text-anchor="middle" class="text">Discover repos</text>
  <text x="545" y="256" text-anchor="middle" class="small">/user/repos per token</text>

  <rect x="705" y="125" width="150" height="70" class="skip" />
  <text x="780" y="154" text-anchor="middle" class="text">Filter skips</text>
  <text x="780" y="176" text-anchor="middle" class="small">remove excluded_repos</text>

  <rect x="890" y="125" width="70" height="70" class="box" />
  <text x="925" y="154" text-anchor="middle" class="text">List</text>
  <text x="925" y="176" text-anchor="middle" class="small">open PRs</text>

  <path d="M170 160 L135 160" class="line" />
  <path d="M385 160 C415 160 415 80 455 80" class="line" />
  <text x="415" y="106" class="small">yes</text>
  <path d="M385 160 C415 160 415 240 455 240" class="line" />
  <text x="415" y="222" class="small">no</text>
  <path d="M635 80 C675 80 675 160 705 160" class="line" />
  <path d="M635 240 C675 240 675 160 705 160" class="line" />
  <path d="M855 160 L890 160" class="line" />
</svg>
